<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Step Motion Lab</title>
    <style>
      :root {
        --bg: #f4f4f6;
        --card: #ffffff;
        --text: #1b1b1f;
        --muted: #6b6b75;
        --track: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111114;
          --card: #1c1c21;
          --text: #f2f2f5;
          --muted: #9a9aa6;
          --track: rgba(255, 255, 255, 0.08);
        }
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.4 system-ui, sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.lead {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 14px;
      }
      .card h2 {
        font-size: 15px;
        margin: 0;
      }
      .card p {
        margin: 2px 0 10px;
        color: var(--muted);
        font-size: 13px;
        min-height: 3.2em;
      }
      canvas {
        width: 100%;
        aspect-ratio: 1;
        display: block;
      }
      .controls {
        margin: 0 0 18px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Step motion lab</h1>
    <p class="lead">Each clock steps every second, like <code>motion: step</code>. The rings are seconds, minutes (sped up ×10) and hours (sped up ×60).</p>
    <div class="controls">
      <label>Slow motion <input id="slow" type="range" min="1" max="4" step="0.5" value="1" /></label>
      <span id="slowv">1×</span>
    </div>
    <div class="grid" id="grid"></div>
    <script>
      // Each variant maps t (0..1 over `ms`) to how far the arc has travelled toward the new value.
      const clamp = (t) => Math.min(1, Math.max(0, t));
      const variants = [
        {
          name: "A · Overshoot (old)",
          desc: "Runs past the new value and springs back. Felt 'pushed forward'.",
          ms: 450,
          ease: (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2,
        },
        {
          name: "B · Sticky snap",
          desc: "The tip holds on for a moment, then lets go and snaps into place. No overshoot.",
          ms: 380,
          ease: (t) => {
            const hold = 0.35;
            if (t < hold) return 0;
            const u = (t - hold) / (1 - hold);
            return 1 - (1 - u) ** 4;
          },
        },
        {
          name: "C · Stretch & snap (current)",
          desc: "Creeps forward slowly as if stretched, then snaps the rest of the way.",
          ms: 450,
          ease: (t) => (t < 0.6 ? 0.25 * (t / 0.6) ** 2 : 0.25 + 0.75 * (1 - (1 - (t - 0.6) / 0.4) ** 3)),
        },
        {
          name: "D · Peel",
          desc: "Pulls back a touch first, like tape peeling off, then moves forward and stops dead.",
          ms: 420,
          ease: (t) => {
            const c = 1.2;
            return (c + 1) * t ** 3 - c * t ** 2;
          },
        },
        {
          name: "E · Glide",
          desc: "Moves quickly at first and settles softly. No overshoot, no hesitation.",
          ms: 350,
          ease: (t) => 1 - (1 - t) ** 3,
        },
      ];

      const colors = ["#ff4d6d", "#ff9f1c", "#4cc9f0"];
      const grid = document.getElementById("grid");
      let slow = 1;
      document.getElementById("slow").addEventListener("input", (e) => {
        slow = Number(e.target.value);
        document.getElementById("slowv").textContent = `${slow}×`;
      });

      const clocks = variants.map((v) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<h2>${v.name}</h2><p>${v.desc}</p><canvas></canvas>`;
        grid.append(card);
        return { v, canvas: card.querySelector("canvas"), rings: [0, 0, 0].map(() => ({ from: 0, to: 0, start: -1e9 })) };
      });

      // A virtual clock ticking once per (real) second × slow.
      let tick = 0;
      let lastTick = performance.now();
      const targets = (n) => [(n % 60) / 60, (Math.floor(n * 10) % 3600) / 3600, ((n * 60) % 86400) / 86400];

      function frame(now) {
        if (now - lastTick >= 1000 * slow) {
          lastTick = now;
          tick++;
          const tg = targets(tick);
          for (const c of clocks) {
            c.rings.forEach((r, i) => {
              const shown = value(c.v, r, now);
              r.from = shown;
              r.to = tg[i];
              r.start = now;
            });
          }
        }
        const css = getComputedStyle(document.documentElement);
        for (const c of clocks) draw(c, now, css.getPropertyValue("--track"), css.getPropertyValue("--text"));
        requestAnimationFrame(frame);
      }

      function value(v, r, now) {
        const t = clamp((now - r.start) / (v.ms * slow));
        return r.from + (r.to - r.from) * v.ease(t);
      }

      function draw(c, now, track, text) {
        const dpr = devicePixelRatio || 1;
        const w = c.canvas.clientWidth;
        if (c.canvas.width !== Math.round(w * dpr)) c.canvas.width = c.canvas.height = Math.round(w * dpr);
        const ctx = c.canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, w);
        const outer = w / 2 - 2;
        const slot = (outer * 0.75) / 3;
        ctx.lineWidth = slot * 0.8;
        ctx.lineCap = "butt";
        c.rings.forEach((r, i) => {
          const rad = outer - slot * (i + 0.5);
          ctx.strokeStyle = track;
          ctx.beginPath();
          ctx.arc(w / 2, w / 2, rad, 0, Math.PI * 2);
          ctx.stroke();
          const p = clamp(value(c.v, r, now));
          if (p <= 0) return;
          ctx.strokeStyle = colors[i];
          ctx.beginPath();
          ctx.arc(w / 2, w / 2, rad, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2);
          ctx.stroke();
        });
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
